# North My Profile — Tower import scheme
#
# Production ownership boundary:
# - Tower: subscriptions, multi-airport aggregation, concrete [Proxy] entries.
# - Surge: policy groups, Smart selection, fallback behavior and routing rules.
#
# After Tower exports the profile to Surge:
# 1) keep Tower's [Proxy] section;
# 2) replace Tower's [Proxy Group] section with profiles/surge-groups-my.conf;
# 3) replace Tower's [Rule] section with one remote include:
#      #!include https://raw.githubusercontent.com/north-coding/Surge-Rules/main/profiles/surge-rules-my.dconf
# 4) confirm [General] contains both `ipv6 = true` and `ipv6-vif = auto`.
#
# The temporary group/rule below exists only so Tower can generate a valid profile.
# It is discarded in the production Surge profile.

[General]
ipv6 = true
ipv6-vif = auto
dns-server = 223.5.5.5, 119.29.29.29
encrypted-dns-server = https://223.5.5.5/dns-query, https://doh.pub/dns-query
proxy-test-url = http://www.gstatic.com/generate_204

[custom]
# Bootstrap only; production groups are Surge-native and use include-all-proxies.
custom_proxy_group=Node Select`select`.*
ruleset=Node Select,[]FINAL
