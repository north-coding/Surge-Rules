# North My Profile — Tower import scheme
# Import this HTTPS URL in Tower via “导入规则链接”.
# Tower owns subscriptions, node aggregation and policy groups.
# Surge owns the production [Rule] section through profiles/surge-rules-my.dconf.
#
# After exporting from Tower to Surge:
# 1) add `ipv6-vif = auto` in [General]
# 2) replace the generated [Rule] section with a single remote include:
#    #!include https://raw.githubusercontent.com/north-coding/Surge-Rules/main/profiles/surge-rules-my.dconf
# 3) change country groups from url-test to Surge Smart in the Surge UI

[General]
ipv6 = true
dns-server = 223.5.5.5, 119.29.29.29
encrypted-dns-server = https://223.5.5.5/dns-query, https://doh.pub/dns-query
proxy-test-url = http://www.gstatic.com/generate_204

[custom]
# Day-to-day selector first. Ordinary overseas traffic defaults to Hong Kong.
custom_proxy_group=Node Select`select`[]🇭🇰 Hong Kong`[]🏳️‍🌈 Taiwan`[]🇯🇵 Japan`[]🇸🇬 Singapore`[]🇺🇸 United States`[]🇰🇷 Korea`[]Manual Select

# Service policies. AI defaults to Taiwan with Japan as the alternate region.
# Concrete TW/JP nodes are also exposed so AI can be pinned manually.
custom_proxy_group=AI`select`[]🏳️‍🌈 Taiwan`[]🇯🇵 Japan`(?i)(台湾|台灣|taiwan|taipei|台北|🇹🇼|🏳️‍🌈|\bTW\b|\bTPE\b)`(?i)(日本|japan|tokyo|东京|東京|osaka|大阪|🇯🇵|\bJP\b)`[]REJECT

# Crypto uses v2fly category-cryptocurrency via Geosite2Surge.
# Keep it pinned to a concrete Taiwan node; REJECT is the only safety fallback.
custom_proxy_group=Crypto`select`(?i)(台湾|台灣|taiwan|taipei|台北|🇹🇼|🏳️‍🌈|\bTW\b|\bTPE\b)`[]REJECT

# ACL4SSR classifies Microsoft / Apple traffic; these groups only decide the route.
custom_proxy_group=Microsoft`select`[]DIRECT`[]🇭🇰 Hong Kong`[]Manual Select
custom_proxy_group=Apple`select`[]DIRECT`[]🇭🇰 Hong Kong`[]Manual Select

# Netflix keeps explicit regional choices.
custom_proxy_group=Netflix`select`[]🇭🇰 Hong Kong`[]🇸🇬 Singapore`[]🇺🇸 United States`[]🇯🇵 Japan`[]Manual Select

# Tower emits country groups as url-test. Convert them to Surge Smart after export.
custom_proxy_group=🇭🇰 Hong Kong`url-test`(?i)(香港|hong[ _-]*kong|🇭🇰|\bHK\b|\bHKG\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🏳️‍🌈 Taiwan`url-test`(?i)(台湾|台灣|taiwan|taipei|台北|🇹🇼|🏳️‍🌈|\bTW\b|\bTPE\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 Japan`url-test`(?i)(日本|japan|tokyo|东京|東京|osaka|大阪|🇯🇵|\bJP\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 Singapore`url-test`(?i)(新加坡|狮城|獅城|singapore|🇸🇬|\bSG\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 United States`url-test`(?i)(美国|美國|united[ _-]*states|america|los[ _-]*angeles|san[ _-]*jose|seattle|🇺🇸|\bUS\b|\bUSA\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇰🇷 Korea`url-test`(?i)(韩国|韓國|korea|seoul|首尔|首爾|🇰🇷|\bKR\b)`http://www.gstatic.com/generate_204`300,,50

# All-node manual toolbox stays at the bottom of the UI.
custom_proxy_group=Manual Select`select`.*

# Minimal safe bootstrap rules only. Production routing is replaced in Surge by
# profiles/surge-rules-my.dconf so ACL4SSR and Crypto are refreshed by Surge itself.
ruleset=DIRECT,[]DOMAIN-SUFFIX,local
ruleset=DIRECT,[]DOMAIN-SUFFIX,localhost
ruleset=DIRECT,[]IP-CIDR,0.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,100.64.0.0/10,no-resolve
ruleset=DIRECT,[]IP-CIDR,127.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,169.254.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,172.16.0.0/12,no-resolve
ruleset=DIRECT,[]IP-CIDR,192.168.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,224.0.0.0/4,no-resolve
ruleset=DIRECT,[]IP-CIDR6,::1/128,no-resolve
ruleset=DIRECT,[]IP-CIDR6,fc00::/7,no-resolve
ruleset=DIRECT,[]IP-CIDR6,fe80::/10,no-resolve
ruleset=Node Select,[]FINAL
