# North My Profile — Tower import scheme
# Import this HTTPS URL in Tower via “导入规则链接”.
# Tower owns subscriptions / multi-airport node aggregation; this file owns policy groups and routing intent.
#
# Important: Tower currently preserves `ipv6 = true` but does not emit Surge's
# `ipv6-vif = auto`. After exporting to Surge, add `ipv6-vif = auto` once in [General].

[General]
ipv6 = true
dns-server = 223.5.5.5, 119.29.29.29
encrypted-dns-server = https://223.5.5.5/dns-query, https://doh.pub/dns-query
proxy-test-url = http://www.gstatic.com/generate_204

[custom]
# Put the day-to-day selector first so Surge shows it before helper/region groups.
# Ordinary overseas traffic defaults to Hong Kong; if the entire Hong Kong group fails,
# switch this selector manually to Japan / Taiwan / Singapore. Tower currently maps
# imported `fallback` groups to `url-test`, so this profile does not pretend to provide
# priority-ordered cross-country failover.
custom_proxy_group=Node Select`select`[]🇭🇰 Hong Kong`[]🏳️‍🌈 Taiwan`[]🇯🇵 Japan`[]🇸🇬 Singapore`[]🇺🇸 United States`[]🇰🇷 Korea`[]Manual Select

# Service policies. Names are English and decorative service emoji are intentionally
# omitted so Surge can use real policy-group icons without duplicate symbols.
# AI defaults to Taiwan auto, with Japan as the clean alternative; individual TW/JP nodes
# are also exposed so the policy can be pinned manually when desired.
custom_proxy_group=AI`select`[]🏳️‍🌈 Taiwan`[]🇯🇵 Japan`(?i)(台湾|台灣|taiwan|taipei|台北|🇹🇼|🏳️‍🌈|\bTW\b|\bTPE\b)`(?i)(日本|japan|tokyo|东京|東京|osaka|大阪|🇯🇵|\bJP\b)`[]REJECT

# Crypto is intentionally NOT automatic: choose a concrete Taiwan node and keep the IP stable.
# REJECT is the only safety fallback; it never silently falls back to Hong Kong / DIRECT.
custom_proxy_group=Crypto Critical`select`(?i)(台湾|台灣|taiwan|taipei|台北|🇹🇼|🏳️‍🌈|\bTW\b|\bTPE\b)`[]REJECT

# Microsoft defaults DIRECT; switch this group to Hong Kong if Teams / Office performs better there.
custom_proxy_group=Microsoft`select`[]DIRECT`[]🇭🇰 Hong Kong`[]Manual Select

# Apple Essential infrastructure defaults DIRECT; region-sensitive Apple content is not blanket-routed.
custom_proxy_group=Apple`select`[]DIRECT`[]🇭🇰 Hong Kong`[]Manual Select

# Netflix defaults Hong Kong, with easy regional alternatives.
custom_proxy_group=Netflix`select`[]🇭🇰 Hong Kong`[]🇸🇬 Singapore`[]🇺🇸 United States`[]🇯🇵 Japan`[]Manual Select

# Country groups: latency-selected across every enabled airport subscription.
# After Tower exports to Surge, these can be changed from url-test to Surge Smart manually.
custom_proxy_group=🇭🇰 Hong Kong`url-test`(?i)(香港|hong[ _-]*kong|🇭🇰|\bHK\b|\bHKG\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🏳️‍🌈 Taiwan`url-test`(?i)(台湾|台灣|taiwan|taipei|台北|🇹🇼|🏳️‍🌈|\bTW\b|\bTPE\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 Japan`url-test`(?i)(日本|japan|tokyo|东京|東京|osaka|大阪|🇯🇵|\bJP\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 Singapore`url-test`(?i)(新加坡|狮城|獅城|singapore|🇸🇬|\bSG\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 United States`url-test`(?i)(美国|美國|united[ _-]*states|america|los[ _-]*angeles|san[ _-]*jose|seattle|🇺🇸|\bUS\b|\bUSA\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇰🇷 Korea`url-test`(?i)(韩国|韓國|korea|seoul|首尔|首爾|🇰🇷|\bKR\b)`http://www.gstatic.com/generate_204`300,,50

# All-node manual toolbox stays at the bottom of the UI.
custom_proxy_group=Manual Select`select`.*

# Local / LAN: stay direct before any Internet classification.
ruleset=DIRECT,[]DOMAIN-SUFFIX,local
ruleset=DIRECT,[]DOMAIN-SUFFIX,localhost
ruleset=DIRECT,[]IP-CIDR,0.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,100.64.0.0/10,no-resolve
ruleset=DIRECT,[]IP-CIDR,127.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,169.254.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,172.16.0.0/12,no-resolve
ruleset=DIRECT,[]IP-CIDR,192.168.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,198.18.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,224.0.0.0/4,no-resolve
ruleset=DIRECT,[]IP-CIDR6,::1/128,no-resolve
ruleset=DIRECT,[]IP-CIDR6,fc00::/7,no-resolve
ruleset=DIRECT,[]IP-CIDR6,fe80::/10,no-resolve

# High-confidence service decisions first.
ruleset=Crypto Critical,https://raw.githubusercontent.com/north-coding/Surge-Rules/main/rules/Crypto-Critical.list
ruleset=AI,https://raw.githubusercontent.com/north-coding/Surge-Rules/main/rules/AI.list
ruleset=Netflix,https://raw.githubusercontent.com/north-coding/Surge-Rules/main/rules/Netflix.list
ruleset=Microsoft,https://raw.githubusercontent.com/north-coding/Surge-Rules/main/rules/Microsoft.list
ruleset=Apple,https://raw.githubusercontent.com/north-coding/Surge-Rules/main/rules/Apple-Direct.list

# Small mainland-direct Google infrastructure set (ACL4SSR GoogleCN style).
# Search / Docs / Drive / YouTube remain unmatched here and therefore follow FINAL -> Hong Kong.
ruleset=DIRECT,https://raw.githubusercontent.com/north-coding/Surge-Rules/main/rules/GoogleCN-Direct.list

# China network fallback. Keep all IP rules below the domain/service rules and immediately above FINAL.
ruleset=DIRECT,https://raw.githubusercontent.com/north-coding/Surge-Rules/main/upstream/cncidr.txt
ruleset=DIRECT,https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/454b1ba7b608d4879b3d01d743ca1e8febc1455c/Ruleset/Surge/ChinaIPv6.list

# Everything else is ordinary overseas traffic; Node Select defaults to Hong Kong.
ruleset=Node Select,[]FINAL
