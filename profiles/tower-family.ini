# North Family Profile — Tower import scheme
# Simple family routing: AI -> Taiwan, Microsoft -> DIRECT by default,
# Netflix -> Hong Kong, China -> DIRECT, everything else -> Hong Kong.
# Tower owns subscriptions / multi-airport node aggregation.
#
# Important: Tower currently preserves `ipv6 = true` but does not emit Surge's
# `ipv6-vif = auto`. After exporting to Surge, add `ipv6-vif = auto` once in [General].

[General]
ipv6 = true
dns-server = 223.5.5.5, 119.29.29.29
encrypted-dns-server = https://223.5.5.5/dns-query, https://doh.pub/dns-query
proxy-test-url = http://www.gstatic.com/generate_204

[custom]
# Country groups: latency-selected across every enabled airport subscription.
custom_proxy_group=🇭🇰 香港`url-test`(?i)(香港|hong[ _-]*kong|🇭🇰|\bHK\b|\bHKG\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇼 台湾`url-test`(?i)(台湾|台灣|taiwan|taipei|台北|🇹🇼|🏳️‍🌈|\bTW\b|\bTPE\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本`url-test`(?i)(日本|japan|tokyo|东京|東京|osaka|大阪|🇯🇵|\bJP\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡`url-test`(?i)(新加坡|狮城|獅城|singapore|🇸🇬|\bSG\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国`url-test`(?i)(美国|美國|united[ _-]*states|america|los[ _-]*angeles|san[ _-]*jose|seattle|🇺🇸|\bUS\b|\bUSA\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇰🇷 韩国`url-test`(?i)(韩国|韓國|korea|seoul|首尔|首爾|🇰🇷|\bKR\b)`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🎛️ 手动切换`select`.*
custom_proxy_group=🚀 节点选择`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🇰🇷 韩国`[]🎛️ 手动切换

# Family service policies.
custom_proxy_group=🤖 AI`select`[]🇹🇼 台湾`[]🇯🇵 日本`(?i)(台湾|台灣|taiwan|taipei|台北|🇹🇼|🏳️‍🌈|\bTW\b|\bTPE\b)`(?i)(日本|japan|tokyo|东京|東京|osaka|大阪|🇯🇵|\bJP\b)`[]REJECT
custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]🇭🇰 香港`[]🎛️ 手动切换
custom_proxy_group=🍎 Apple`select`[]DIRECT`[]🇭🇰 香港`[]🎛️ 手动切换
custom_proxy_group=🎞️ Netflix`select`[]🇭🇰 香港`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🇯🇵 日本`[]🎛️ 手动切换

# Local / LAN.
ruleset=DIRECT,[]DOMAIN-SUFFIX,local
ruleset=DIRECT,[]DOMAIN-SUFFIX,localhost
ruleset=DIRECT,[]IP-CIDR,0.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,100.64.0.0/10,no-resolve
ruleset=DIRECT,[]IP-CIDR,127.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,169.254.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,172.16.0.0/12,no-resolve
ruleset=DIRECT,[]IP-CIDR,192.168.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,198.18.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,224.0.0.0/4,no-resolve
ruleset=DIRECT,[]IP-CIDR6,::1/128,no-resolve
ruleset=DIRECT,[]IP-CIDR6,fc00::/7,no-resolve
ruleset=DIRECT,[]IP-CIDR6,fe80::/10,no-resolve

# High-confidence service decisions.
ruleset=🤖 AI,https://raw.githubusercontent.com/north-coding/Surge-Rules/main/rules/AI.list
ruleset=🎞️ Netflix,https://raw.githubusercontent.com/north-coding/Surge-Rules/main/rules/Netflix.list
ruleset=🪟 Microsoft,https://raw.githubusercontent.com/north-coding/Surge-Rules/main/rules/Microsoft.list
ruleset=🍎 Apple,https://raw.githubusercontent.com/north-coding/Surge-Rules/main/rules/Apple-Direct.list

# China network fallback. Keep all IP rules below the domain rules and immediately above FINAL.
# IPv4 is our reviewed Loyalsoldier mirror. IPv6 is a reviewed, commit-pinned Surge-only snapshot;
# it will be mirrored into this repository by a follow-up upstream-sync change.
ruleset=DIRECT,https://raw.githubusercontent.com/north-coding/Surge-Rules/main/upstream/cncidr.txt
ruleset=DIRECT,https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/454b1ba7b608d4879b3d01d743ca1e8febc1455c/Ruleset/Surge/ChinaIPv6.list

# Google / YouTube / Zoom and all other unmatched overseas traffic use Hong Kong by default.
ruleset=🚀 节点选择,[]FINAL
