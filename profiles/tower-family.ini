# North Family Profile — Tower import scheme
# Simple family routing: AI -> Taiwan, Microsoft -> DIRECT by default,
# Netflix -> Hong Kong, China -> DIRECT, everything else -> Hong Kong.
# Tower owns subscriptions / multi-airport node aggregation.
#
# Important: Tower currently preserves `ipv6 = true` but does not emit Surge's
# `ipv6-vif = auto`. After exporting to Surge, add `ipv6-vif = auto` once in [General].
# Tower also maps imported automatic region groups to `url-test`; if Surge Smart is desired,
# change the six region groups from `url-test` to `smart` in the final Surge profile.

[General]
ipv6 = true
dns-server = 223.5.5.5, 119.29.29.29
encrypted-dns-server = https://223.5.5.5/dns-query, https://doh.pub/dns-query
proxy-test-url = http://www.gstatic.com/generate_204

[custom]
# Day-to-day selector first. Ordinary overseas traffic defaults to Hong Kong.
custom_proxy_group=Node Select`select`[]Hong Kong`[]Taiwan`[]Japan`[]Singapore`[]United States`[]South Korea`[]Manual Select

# Family service policies.
custom_proxy_group=AI`select`[]Taiwan`[]Japan`(?i)(台湾|台灣|taiwan|taipei|台北|🇹🇼|🏳️‍🌈|\bTW\b|\bTPE\b)`(?i)(日本|japan|tokyo|东京|東京|osaka|大阪|🇯🇵|\bJP\b)`[]REJECT
custom_proxy_group=Microsoft`select`[]DIRECT`[]Hong Kong`[]Manual Select
custom_proxy_group=Apple`select`[]DIRECT`[]Hong Kong`[]Manual Select
custom_proxy_group=Netflix`select`[]Hong Kong`[]Singapore`[]United States`[]Japan`[]Manual Select

# Region groups: Tower currently exports these as latency-based automatic groups.
custom_proxy_group=Hong Kong`url-test`(?i)(香港|hong[ _-]*kong|🇭🇰|\bHK\b|\bHKG\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=Taiwan`url-test`(?i)(台湾|台灣|taiwan|taipei|台北|🇹🇼|🏳️‍🌈|\bTW\b|\bTPE\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=Japan`url-test`(?i)(日本|japan|tokyo|东京|東京|osaka|大阪|🇯🇵|\bJP\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=Singapore`url-test`(?i)(新加坡|狮城|獅城|singapore|🇸🇬|\bSG\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=United States`url-test`(?i)(美国|美國|united[ _-]*states|america|los[ _-]*angeles|san[ _-]*jose|seattle|🇺🇸|\bUS\b|\bUSA\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=South Korea`url-test`(?i)(韩国|韓國|korea|seoul|首尔|首爾|🇰🇷|\bKR\b)`http://www.gstatic.com/generate_204`300,,50

# All-node manual toolbox stays at the bottom of the UI.
custom_proxy_group=Manual Select`select`.*

# Local / LAN.
ruleset=DIRECT,[]DOMAIN-SUFFIX,local
ruleset=DIRECT,[]DOMAIN-SUFFIX,localhost
ruleset=DIRECT,[]IP-CIDR,0.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,100.64.0.0/10,no-resolve
ruleset=DIRECT,[]IP-CIDR,127.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,169.254.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,172.16.0.0/12,no-resolve
ruleset=DIRECT,[]IP-CIDR,192.168.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,198.18.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,224.0.0.0/4,no-resolve
ruleset=DIRECT,[]IP-CIDR6,::1/128,no-resolve
ruleset=DIRECT,[]IP-CIDR6,fc00::/7,no-resolve
ruleset=DIRECT,[]IP-CIDR6,fe80::/10,no-resolve

# High-confidence service decisions.
ruleset=AI,https://raw.githubusercontent.com/north-coding/Surge-Rules/main/rules/AI.list
ruleset=Netflix,https://raw.githubusercontent.com/north-coding/Surge-Rules/main/rules/Netflix.list
ruleset=Microsoft,https://raw.githubusercontent.com/north-coding/Surge-Rules/main/rules/Microsoft.list
ruleset=Apple,https://raw.githubusercontent.com/north-coding/Surge-Rules/main/rules/Apple-Direct.list

# Small mainland-direct Google infrastructure set, intentionally after AI so Gemini stays on AI.
ruleset=DIRECT,https://raw.githubusercontent.com/north-coding/Surge-Rules/main/rules/GoogleCN-Direct.list

# China network fallback. Keep all IP rules below the domain rules and immediately above FINAL.
ruleset=DIRECT,https://raw.githubusercontent.com/north-coding/Surge-Rules/main/upstream/cncidr.txt
ruleset=DIRECT,https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/454b1ba7b608d4879b3d01d743ca1e8febc1455c/Ruleset/Surge/ChinaIPv6.list

# Google / YouTube / Zoom and all other unmatched overseas traffic use Hong Kong by default.
ruleset=Node Select,[]FINAL
