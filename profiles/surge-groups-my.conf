[Proxy Group]
# Surge-native policy groups. Tower-generated groups are discarded after export.
# Country groups automatically collect concrete proxies from [Proxy] by node name.

# Daily selector. Ordinary overseas traffic defaults to Hong Kong.
Node Select = select, 🇭🇰 Hong Kong, 🏳️‍🌈 Taiwan, 🇯🇵 Japan, 🇸🇬 Singapore, 🇺🇸 United States, 🇰🇷 Korea, Manual Select

# Service policies.
# AI prefers the Taiwan Smart pool and falls back to Japan only when Taiwan is unavailable.
AI = fallback, 🏳️‍🌈 Taiwan, 🇯🇵 Japan, REJECT, evaluate-before-use=true, no-alert=true

# Crypto deliberately exposes only concrete Taiwan proxies plus REJECT.
# On first installation select one concrete Taiwan node and keep it pinned for a stable exit IP.
Crypto = select, REJECT, include-all-proxies=true, policy-regex-filter="(?i)(台湾|台灣|taiwan|taipei|台北|🇹🇼|🏳️‍🌈|\bTW\b|\bTPE\b)"

Microsoft = select, DIRECT, 🇭🇰 Hong Kong, Manual Select
Apple = select, DIRECT, 🇭🇰 Hong Kong, Manual Select
Netflix = select, 🇭🇰 Hong Kong, 🇸🇬 Singapore, 🇺🇸 United States, 🇯🇵 Japan, Manual Select

# Country pools use Surge Smart so selection is based on real connection quality,
# retransmissions and per-site history rather than simple periodic latency alone.
🇭🇰 Hong Kong = smart, include-all-proxies=true, policy-regex-filter="(?i)(香港|hong[ _-]*kong|🇭🇰|\bHK\b|\bHKG\b)"
🏳️‍🌈 Taiwan = smart, include-all-proxies=true, policy-regex-filter="(?i)(台湾|台灣|taiwan|taipei|台北|🇹🇼|🏳️‍🌈|\bTW\b|\bTPE\b)"
🇯🇵 Japan = smart, include-all-proxies=true, policy-regex-filter="(?i)(日本|japan|tokyo|东京|東京|osaka|大阪|🇯🇵|\bJP\b)"
🇸🇬 Singapore = smart, include-all-proxies=true, policy-regex-filter="(?i)(新加坡|狮城|獅城|singapore|🇸🇬|\bSG\b)"
🇺🇸 United States = smart, include-all-proxies=true, policy-regex-filter="(?i)(美国|美國|united[ _-]*states|america|los[ _-]*angeles|san[ _-]*jose|seattle|🇺🇸|\bUS\b|\bUSA\b)"
🇰🇷 Korea = smart, include-all-proxies=true, policy-regex-filter="(?i)(韩国|韓國|korea|seoul|首尔|首爾|🇰🇷|\bKR\b)"

# All concrete proxies remain available for manual troubleshooting or one-off routing.
Manual Select = select, include-all-proxies=true
